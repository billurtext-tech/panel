services:
  # Backend API (Express)
  - type: web
    name: billur-erp-api
    env: node
    plan: starter
    region: frankfurt
    rootDir: backend
    # migrate: production'da tsx yo'q — build dan keyin compiled JS
    buildCommand: npm install && npm run build && node dist/shared/database/migrate.js
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://billur-erp-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: billur-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # BoxApp integratsiya — Render dashboard'da to'ldiring
      - key: BOXAPP_API_URL
        sync: false
      - key: BOXAPP_API_KEY
        sync: false

  # Frontend (Next.js — runtime, not static)
  - type: web
    name: billur-erp-web
    env: node
    plan: starter
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://billur-erp-api.onrender.com
      - key: PORT
        value: 3000

databases:
  - name: billur-erp-db
    region: frankfurt
    plan: free
